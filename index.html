<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幼兒園教保專業 AI 輔助系統 | 彭婉如文教基金會・台灣公共托育協會</title>
  <style>
    :root {
      --primary: #8E3B68;
      --primary-hover: #732A52;
      --primary-light: #F7EBF1;
      --accent-ribbon: #D9384E;
      --accent-elephant: #8B5FBF;
      --bg: #FAF5F8;
      --card-bg: #FFFFFF;
      --border: #EEDEE6;
      --text: #33222B;
      --text-muted: #7E6B75;
      --sidebar-width: 270px;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }
    
    /* 頂部 Header */
    header {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 2px 10px rgba(142, 59, 104, 0.06);
    }
    .brand-wrap { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      flex-wrap: wrap; 
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary-light);
      padding: 8px 16px;
      border-radius: 26px;
      border: 1.5px solid #E6D0DD;
    }
    .icon-ribbon, .icon-elephant {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 19px;
      color: #fff;
      flex-shrink: 0;
    }
    .icon-ribbon { background: var(--accent-ribbon); }
    .icon-elephant { background: var(--accent-elephant); }
    .brand-text { font-size: 1.12rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
    .system-title { font-size: 1.2rem; font-weight: 900; color: var(--primary-hover); letter-spacing: 0.5px; }

    /* 主架構 */
    .app-layout {
      display: flex;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      gap: 22px;
    }
    
    /* 左側選單 */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px;
      box-shadow: 0 3px 10px rgba(142, 59, 104, 0.04);
    }
    .sidebar-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 4px;
    }
    
    /* 選單按鈕容器 */
    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .menu-item:hover { background: var(--primary-light); color: var(--primary); }
    .menu-item.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(142, 59, 104, 0.25);
    }

    /* 右側主面板 */
    .main-panel {
      flex: 1;
      min-width: 0;
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 28px;
      box-shadow: 0 4px 16px rgba(142, 59, 104, 0.05);
    }
