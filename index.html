<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幼兒園教保專業 AI 輔助系統 | 彭婉如文教基金會・台灣公共托育協會</title>
  <style>
    :root {
      --primary: #8E3B68;
      --primary-hover: #732A52;
      --primary-light: #F7EBF1;
      --accent-ribbon: #D9384E;
      --accent-elephant: #8B5FBF;
      --bg: #FAF5F8;
      --card-bg: #FFFFFF;
      --border: #EEDEE6;
      --text: #33222B;
      --text-muted: #7E6B75;
      --sidebar-width: 270px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: 0 2px 10px rgba(142, 59, 104, 0.06);
    }
    .brand-wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary-light);
      padding: 8px 16px;
      border-radius: 26px;
      border: 1.5px solid #E6D0DD;
    }
    .icon-ribbon, .icon-elephant {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 19px;
      color: #fff;
      flex-shrink: 0;
    }
    .icon-ribbon { background: var(--accent-ribbon); }
    .icon-elephant { background: var(--accent-elephant); }
    .brand-text { font-size: 1.12rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
    .system-title { font-size: 1.2rem; font-weight: 900; color: var(--primary-hover); letter-spacing: 0.5px; }

    .app-layout {
      display: flex;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      gap: 22px;
    }
    
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px;
      box-shadow: 0 3px 10px rgba(142, 59, 104, 0.04);
    }
    .sidebar-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 6px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .menu-item:hover { background: var(--primary-light); color: var(--primary); }
    .menu-item.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(142, 59, 104, 0.25);
    }

    .main-panel {
      flex: 1;
      min-width: 0;
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 28px;
      box-shadow: 0 4px 16px rgba(142, 59, 104, 0.05);
    }

    .key-box {
      background: linear-gradient(135deg, #FFF6F9 0%, #F9EDF3 100%);
      border: 1.5px dashed var(--primary);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 22px;
    }
    .key-box label { color: var(--primary-hover); font-weight: 700; margin-bottom: 6px; display: block; font-size: 0.92rem; }
    .key-box input {
      background: #FFFFFF !important;
      border: 1px solid #DDB8CB !important;
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.92rem;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .module-header { margin-bottom: 20px; border-bottom: 1.5px solid var(--border); padding-bottom: 10px; }
    .module-header h2 { color: var(--primary); font-size: 1.3rem; }
    .module-header p { font-size: 0.88rem; color: var(--text-muted); margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px; color: #44323D; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: #FFFDFE;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: #FFFFFF; }
    textarea { resize: vertical; min-height: 90px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, #A34879 100%);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(142, 59, 104, 0.2);
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.95; }
    .btn:disabled { background: #B3A4AC; cursor: not-allowed; box-shadow: none; }

    /* 結果輸出與匯出區塊 */
    .result-container {
      margin-top: 24px;
      padding: 20px;
      background: #FDF9FB;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: none;
    }
    .result-container.show { display: block; }
    .result-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-hover);
      margin-bottom: 10px;
      display: flex;
